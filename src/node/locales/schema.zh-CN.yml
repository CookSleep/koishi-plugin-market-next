# 每一项对应配置页上的一个分区，顺序与 src/node/config.ts 中的 Schema.intersect 一致。
- $description: 显示
  frontendMode:
    $description: 插件市场页的显示风格。精致模式会加上背景装饰和动画。
    $inner:
      - 性能模式
      - 精致模式
  depsLayout:
    $description: 依赖管理页默认的视图，页面右上角也可以随时切换。
    $inner:
      - 卡片
      - 列表

# 这一分区是「开关 + 开启时才显示的时间项」，所以按子 Schema 逐个给出文案。
- - $description: 后台检查
    idleProbe: 控制台没人使用时，在后台检查依赖和插件市场的更新。只刷新数据，不会自动安装。
  - - {}
    - idleProbeDelayMinutes: 控制台闲置多少分钟后开始检查。
      idleProbeBootDelayMinutes: Koishi 启动或重载后，至少等多少分钟再开始检查。
      idleProbeIntervalHours: 两次检查之间至少间隔多少小时。

- registry:
    $description: npm 源
    endpoint: 安装插件使用的 npm 源。留空时沿用项目自己的 npm 配置。
    timeoutSeconds: 获取单个依赖版本信息的超时时间，单位为秒，0 表示不限时。
    autoRoute: 当前源获取失败时，自动换用备用源。
    retry: 每个源失败后重试的次数。
    concurrency: 同时获取版本信息的依赖数量。
    installLogRetentionDays: 安装、更新和卸载日志的保留天数。

- search:
    $description: 插件市场源
    endpoint: 插件市场索引的地址，其他可用的镜像列在本页顶部。
    timeoutSeconds: 拉取市场索引的超时时间，单位为秒，0 表示不限时。
    proxyAgent: 拉取市场索引时使用的代理，不影响 npm 源。
    autoRoute: 当前市场源失败或明显偏慢时，自动换用备用源。

- $description: 市场过滤
  marketSilentRules:
    $description: 符合规则的插件会直接从插件市场中隐藏。
    type:
      $description: 类型
      $inner:
        - 预览版插件
        - 不安全插件
        - 插件包
        - 创建早于某天
        - 创建晚于某天
        - 更新早于某天
        - 更新晚于某天
        - 最近 N 天内创建
        - 最近 N 天内更新
        - 自定义搜索条件
    value: 日期填 YYYY-MM-DD，天数填数字，自定义条件填搜索语法（如 category:adapter）；前三种类型不用填。
    note: 备注
    enabled: 启用

- $description: 其他
  chatlunaTool: 为 ChatLuna 提供一个只读的插件市场查询工具（koishi_plugin_market_search），需要先安装 ChatLuna。
  logLevel: 日志的详细程度。silent 不输出，debug 输出全部调试信息。

# 以下选项由控制台页面写入，配置页上不显示。
- bulkMode: 批量操作模式。
  removeConfig:
    $description: 卸载插件时是否同时删除它的配置。
    $inner:
      - 每次询问
      - 删除
      - 保留
  updateIgnoredPackages: 不检查更新的依赖，每行一个。
  updateIgnoreDays: 「忽略此更新」默认忽略的天数，0 表示一直忽略。
  updateIgnoreVersions: 「忽略此更新」时连续忽略的版本数。
  updateIgnorePrerelease: 不把 alpha、beta、rc 等预发布版本当作更新。
  marketSilentFilters: 旧版静默过滤。
