registry:
  $description: npm 源
  endpoint: 安装插件时使用的 npm 源。留空则沿用当前项目的 npm 配置。
  timeoutSeconds: 单次获取版本信息的超时时间，单位为秒。
  autoRoute: 当前 npm 源获取版本失败时，自动尝试备用源。
  retry: 每个 npm 源获取失败后重试几次。
  concurrency: 同时获取多少个依赖的版本信息。
  installLogRetentionHours: 安装、更新和卸载的日志保留多少小时。

search:
  $description: 插件市场源
  endpoint: 插件市场索引的地址，默认使用 t4wefan 镜像。
  timeoutSeconds: 拉取插件市场索引的超时时间，单位为秒。
  proxyAgent: 只用于拉取插件市场索引的代理地址。
  autoRoute: 当前市场源失败或明显过慢时，自动尝试备用源。
  logLevel: 插件市场调试日志级别（兼容旧版设置）。

logLevel: 日志级别。silent 不输出，debug 最详细。
marketSilentFilters: 旧版永久静默过滤。
idleProbe: 没有人打开控制台时，在后台检查依赖和插件市场有没有更新。只更新数据，不会安装任何东西。
idleProbeDelayMinutes: 控制台没人在线多久后开始后台检查，单位为分钟。
idleProbeBootDelayMinutes: Koishi 启动或重载后，至少等待多久才开始后台检查，单位为分钟。
idleProbeIntervalHours: 两次后台检查之间至少间隔多久，单位为小时。
bulkMode: 批量操作模式。开启后安装、更新、卸载会先暂存，点击“应用更改”后执行。
removeConfig:
  $description: 卸载插件时是否同时删除已有插件配置。未设置时每次询问。
  $inner:
    - 每次询问
    - 始终删除插件配置
    - 永不删除插件配置
updateIgnoredPackages: 不检测更新的依赖名。每行一个包名，也可以使用逗号、分号或空格分隔。
updateIgnoreDuration: 点击“忽略此次更新”后的默认忽略时长。0 表示不按时间过期。
updateIgnoreVersions: 点击“忽略此次更新”后连续忽略几个新版本。1 表示只忽略当前最新版本。
updateIgnorePrerelease: 手动开启后，alpha / beta / rc 等预发布版本不会被视为可更新版本。
chatlunaTool: 给 ChatLuna 注册一个只读的插件市场查询工具（koishi_plugin_market_search）。需要另外安装并启用 ChatLuna；不开启也不影响其他功能。

frontendMode:
  $description: 插件市场页的显示风格。精致模式会加上更多动效和背景装饰。
  $inner:
    - 性能模式
    - 精致模式
depsLayout:
  $description: 依赖管理页默认使用的视图，也可以在页面右上角随时切换。
  $inner:
    - 卡片视图
    - 列表视图
marketSilentRules:
  $description: 插件市场永久静默过滤。添加后命中的插件会直接隐藏，不会显示在搜索框中。
  type:
    $description: 规则类型
    $inner:
      - 状态：预览版插件
      - 状态：不安全插件
      - 状态：插件包
      - 创建时间：早于指定日期
      - 创建时间：晚于指定日期
      - 更新时间：早于指定日期
      - 更新时间：晚于指定日期
      - 创建时间：最近 N 天内
      - 更新时间：最近 N 天内
      - 自定义高级条件
  value: 规则值。状态类留空；日期类填写 YYYY-MM-DD；最近 N 天填写数字；自定义规则填写搜索条件。
  note: 备注
  enabled: 是否启用
