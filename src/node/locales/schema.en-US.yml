registry:
  $description: npm Registry
  endpoint: npm registry used to install plugins. Leave empty to follow the npm config of the current project.
  timeout: Timeout of a single version lookup, in milliseconds.
  autoRoute: Try fallback registries when the current one fails to return version info.
  retry: How many times to retry each registry after a failure.
  concurrency: How many dependencies to look up at the same time.
  installLogRetentionHours: How many hours to keep install, update and uninstall logs.
search:
  $description: Plugin Market Source
  endpoint: URL of the plugin market index. Uses the t4wefan mirror by default.
  timeout: Timeout for fetching the market index, in milliseconds.
  proxyAgent: Proxy used only for fetching the market index.
  autoRoute: Try fallback sources when the current market source fails or is clearly too slow.
  logLevel: Plugin market log level (legacy setting).

logLevel: Log level. silent prints nothing; debug is the most detailed.
marketSilentFilters: Legacy permanent silent filters.
idleProbe: Check dependencies and the plugin market for updates in the background while nobody has the console open. It only refreshes data and never installs anything.
idleProbeDelay: How long the console must be unattended before a background check starts, in milliseconds (default 5 minutes).
idleProbeBootDelay: Minimum wait after Koishi starts or reloads before background checks are allowed, in milliseconds (default 1 minute).
idleProbeInterval: Minimum interval between two background checks, in milliseconds (default 6 hours).
bulkMode: Batch operation mode. Dependency install, update, and uninstall actions are staged until applying changes.
removeConfig:
  $description: Whether to remove existing plugin config when uninstalling a plugin. Ask every time when unset.
  $inner:
    - Ask every time
    - Always remove plugin config
    - Never remove plugin config
updateIgnoredPackages: Dependency package names that should not be checked for updates. One package per line, or separated by commas, semicolons, or spaces.
updateIgnoreDuration: Default duration after ignoring one update. 0 means no time-based expiry.
updateIgnoreVersions: How many consecutive newer versions should be ignored after ignoring one update. 1 means only the current latest version.
updateIgnorePrerelease: When enabled, alpha / beta / rc and other prerelease versions are not treated as update targets.
chatlunaTool: Register a read-only plugin market query tool (koishi_plugin_market_search) for ChatLuna. ChatLuna must be installed and enabled separately; other features work without it.

frontendMode:
  $description: Display style of the plugin market page. Polished mode adds more animation and background decoration.
  $inner:
    - Performance mode
    - Polished mode
depsLayout:
  $description: Default view of the Dependencies page. You can also switch it at any time in the top-right corner of the page.
  $inner:
    - Card view
    - List view
marketSilentRules:
  $description: Permanent silent market filters. Matched plugins are hidden from the market page.
  type:
    $description: Rule type
    $inner:
      - 'Status: plugin in development'
      - 'Status: insecure plugin'
      - 'Status: plugin bundle'
      - Created before a date
      - Created after a date
      - Updated before a date
      - Updated after a date
      - Created within the last N days
      - Updated within the last N days
      - Custom advanced condition
  value: 'Rule value. Leave status rules empty; use YYYY-MM-DD for dates, a number for recent-day rules, or a search condition for custom rules.'
  note: Note
  enabled: Enabled
